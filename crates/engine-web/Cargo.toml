[package]
name = "dnd-engine-web"
description = "Веб-версия игрового движка: JSON-интерфейс для сборки wasm32 → JavaScript"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dnd-engine = { path = "../engine", features = ["serde"] }
dnd-master = { path = "../master" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
