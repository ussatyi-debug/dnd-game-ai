[package]
name = "dnd-game-ai"
description = "Текстовая D&D-игра с ИИ-мастером"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dnd_game_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dnd-engine = { path = "../crates/engine", features = ["serde"] }
dnd-master = { path = "../crates/master" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Встроенный Silero (озвучка) — только в версии для Windows: libtorch скачивается при сборке.
[target.'cfg(windows)'.dependencies]
tch = { version = "0.20", features = ["download-libtorch"] }
