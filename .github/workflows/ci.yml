name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Движок — формат, линтер, тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Согласованность версий
        shell: bash
        run: |
          cargo_v=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          npm_v=$(node -p "require('./package.json').version")
          tauri_v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "Cargo: $cargo_v, package.json: $npm_v, tauri.conf.json: $tauri_v"
          if [ "$cargo_v" != "$npm_v" ] || [ "$cargo_v" != "$tauri_v" ]; then
            echo "::error::Версии в Cargo.toml, package.json и tauri.conf.json должны совпадать"
            exit 1
          fi
      - name: Форматирование
        run: cargo fmt --all --check
      - name: Линтер
        run: cargo clippy -p dnd-engine --all-targets --all-features -- -D warnings
      - name: Тесты
        run: cargo test -p dnd-engine --all-features

  frontend:
    name: Интерфейс — типы и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Проверка типов и сборка
        run: npm run build

  windows:
    name: Сборка Windows (.exe)
    needs: [engine, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Сборка интерфейса
        run: npm run build
      - name: Линтер приложения
        run: cargo clippy -p dnd-game-ai -- -D warnings
      - name: Сборка установщика
        run: npx tauri build
      - name: Установщик
        uses: actions/upload-artifact@v4
        with:
          name: dnd-game-ai-windows-${{ github.ref_name }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Тег версии и релиз
    needs: [windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Определение версии
        id: version
        shell: bash
        run: |
          tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Тег $tag уже существует — релиз не создаётся"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Загрузка установщика
        if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: dnd-game-ai-windows-${{ github.ref_name }}
          path: release-files
      - name: Создание тега и релиза
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DnD Game AI ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release-files/*.exe
          generate_release_notes: true
