name: Образцы озвучки
on:
  push:
    branches: [tts-samples]
jobs:
  sample:
    strategy:
      fail-fast: false
      matrix:
        engine: [vosk]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Зависимости
        run: |
          case "${{ matrix.engine }}" in
            piper) pip install piper-tts ;;
            vosk) pip install vosk-tts ;;
            silero) pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install numpy omegaconf ;;
            xtts) pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install 'coqui-tts[codec]' six ;;
          esac
      - name: Синтез
        run: python scripts/tts-samples/${{ matrix.engine }}_samples.py scripts/tts-samples/phrase.txt out
      - name: MP3
        run: for f in out/*.wav; do ffmpeg -loglevel error -y -i "$f" -codec:a libmp3lame -q:a 3 "${f%.wav}.mp3"; done; ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: tts-${{ matrix.engine }}
          path: out/*.mp3
  collect:
    needs: [sample]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: samples
          merge-multiple: true
      - name: Ветка с образцами
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd samples && ls -l
          git init -q -b tts-samples-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "образцы озвучки ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tts-samples-out
