name: silero-probe
on:
  push:
    branches: [fix/pack-0.9.7]
    paths: [scripts/silero/**, .github/workflows/silero-probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install silero silero-stress omegaconf onnx onnxruntime
      - run: python scripts/silero/probe.py 2>&1 | tee probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: silero-probe, path: "probe.log\nscripts/silero/out/**" }
